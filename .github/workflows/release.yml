name: Release

# 推送 v 开头的标签（例如 v1.5.8）时，打出两个签名正式版 APK 并发布到 GitHub Releases。
# 标签里的版本号必须和 android/app/build.gradle 里的 versionName 一致。
# 也可以在 Actions 页面手动运行，填一个已有的标签（标签已推送但上次发布失败时用）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有标签，例如 v1.5.7'
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check tag matches versionName
        run: |
          VERSION="${TAG#v}"
          NAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          if [ "$VERSION" != "$NAME" ]; then
            echo "::error::标签 $TAG 和 versionName $NAME 不一致"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # 发布版必须有正式签名，缺 Secret 时直接失败，不发调试签名的包
      - name: Restore release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::仓库 Secrets 里缺少 RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs (完整版 + 无过敏记录版)
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename and verify signature
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/full/release/*.apk "dist/riji-$VERSION-full.apk"
          cp android/app/build/outputs/apk/noAllergy/release/*.apk "dist/riji-$VERSION-noAllergy.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # 日迹正式版签名证书的 SHA-256 指纹（公开信息），签名不对就不发布
          EXPECTED=d94b4d8479505f8d30b96013cb85beed4c5c8028aa92e008265ca17535071bc5
          for f in dist/*.apk; do
            CERTS=$("$APKSIGNER" verify --print-certs "$f")
            echo "$CERTS" | grep -E 'certificate (DN|SHA-256 digest)'
            if ! echo "$CERTS" | grep -q "certificate SHA-256 digest: $EXPECTED"; then
              echo "::error::$f 的签名不是日迹正式版签名"
              exit 1
            fi
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Release notes from CHANGELOG
        run: |
          {
            awk -v v="$VERSION" '
              /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
              found' CHANGELOG.md
            echo
            echo "### 下载"
            echo
            echo "- \`riji-$VERSION-full.apk\`：完整版"
            echo "- \`riji-$VERSION-noAllergy.apk\`：无过敏记录版（去掉过敏记录，其它一样）"
            echo
            echo "两个版本包名相同，只能装其中一个。"
          } > notes.md
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "日迹 $VERSION" \
            --notes-file notes.md \
            --verify-tag
