name: Release

# 发布正式版：打出两个签名正式版 APK 并发布到 GitHub Releases。三种触发方式：
# - 推送到 main：android/app/build.gradle 里的 versionName 还没有对应的 v 标签时，自动打标签并发布；
#   版本号没改（标签已经有了）就什么都不做，所以平时的提交不会发版
# - 推送 v 开头的标签（例如 v1.5.8）：直接发布这个标签，标签里的版本号必须和 versionName 一致
# - 在 Actions 页面手动运行：填一个标签；不填就用 main 上当前的 versionName。标签不存在时在 main 最新提交上创建
#   （标签已推送但上次发布失败时，也用这个重新发布）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v1.5.7；不填就用当前的 versionName'
        required: false

permissions:
  contents: write

jobs:
  # 决定发布哪个标签，需要的话先把标签打上。用 GITHUB_TOKEN 推的标签不会再触发一次这个工作流，所以不会重复发布
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide tag
        id: decide
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          NAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${INPUT_TAG:-v$NAME}"
          RC=0; git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || RC=$?
          if [ "$RC" != 0 ] && [ "$RC" != 2 ]; then echo "::error::查不了远程标签"; exit 1; fi
          if [ "$RC" = 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "$TAG 已经有了（版本号没改），不发布"
              exit 0
            fi
            echo "发布已有的标签 $TAG"
          else
            if [ "${TAG#v}" != "$NAME" ]; then
              echo "::error::标签 $TAG 和 versionName $NAME 不一致，不打标签"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            echo "在 ${GITHUB_SHA::7} 上打了标签 $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    # 同一个提交的日常构建（推送 main）和发布排队、不同时跑：
    # 两个同时跑时打包几次在一分钟内失败，单独跑都成功
    concurrency:
      group: android-build-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check tag matches versionName
        run: |
          VERSION="${TAG#v}"
          NAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          if [ "$VERSION" != "$NAME" ]; then
            echo "::error::标签 $TAG 和 versionName $NAME 不一致"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # 发布版必须有正式签名，缺 Secret 时直接失败，不发调试签名的包
      - name: Restore release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::仓库 Secrets 里缺少 RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs (完整版 + 无过敏记录版)
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # 构建机偶尔出网络问题（依赖下载失败）：失败了再试一次，第二次带完整报错
          ./gradlew assembleRelease || { echo "::warning::第一次打包失败，重试一次"; ./gradlew assembleRelease --stacktrace; }

      - name: Rename and verify signature
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/full/release/*.apk "dist/riji-$VERSION-full.apk"
          cp android/app/build/outputs/apk/noAllergy/release/*.apk "dist/riji-$VERSION-noAllergy.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # 日迹正式版签名证书的 SHA-256 指纹（公开信息），签名不对就不发布
          EXPECTED=d94b4d8479505f8d30b96013cb85beed4c5c8028aa92e008265ca17535071bc5
          for f in dist/*.apk; do
            CERTS=$("$APKSIGNER" verify --print-certs "$f")
            echo "$CERTS" | grep -E 'certificate (DN|SHA-256 digest)'
            if ! echo "$CERTS" | grep -q "certificate SHA-256 digest: $EXPECTED"; then
              echo "::error::$f 的签名不是日迹正式版签名"
              exit 1
            fi
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Release notes from CHANGELOG
        run: |
          {
            awk -v v="$VERSION" '
              /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
              found' CHANGELOG.md
            echo
            echo "### 下载"
            echo
            echo "- \`riji-$VERSION-full.apk\`：完整版"
            echo "- \`riji-$VERSION-noAllergy.apk\`：无过敏记录版（去掉过敏记录，其它一样）"
            echo
            echo "两个版本包名相同，只能装其中一个。"
          } > notes.md
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "日迹 $VERSION" \
            --notes-file notes.md \
            --verify-tag
