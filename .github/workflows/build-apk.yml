name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 签名：仓库 Secret 里有 DEBUG_KEYSTORE_BASE64（电脑上 ~/.android/debug.keystore 的 base64）时用它签名，
      # 打出来的包和自己电脑上打的签名一致，可以直接覆盖安装、数据保留。
      # 没设置时用这次构建临时生成的签名（每次都不同，覆盖安装会提示签名不一致）。
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "使用仓库 Secret 里的签名"
          else
            echo "::warning::没有设置 DEBUG_KEYSTORE_BASE64，本次用临时签名，不能覆盖安装手机上已有的版本"
          fi

      - name: Build debug + release APKs (完整版 + 无过敏记录版)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: birthday-reminder-apk
          path: android/app/build/outputs/apk/*/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: birthday-reminder-apk-release
          path: android/app/build/outputs/apk/*/release/*.apk
