name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 和发布（release.yml）共用一个排队组：同一个提交的两次构建不同时跑
concurrency:
  group: android-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 调试版签名：仓库 Secret 里有 DEBUG_KEYSTORE_BASE64（电脑上 ~/.android/debug.keystore 的 base64）时用它，
      # 和自己电脑上打的调试版签名一致；没设置时用这次构建临时生成的签名（每次都不同）。
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "使用仓库 Secret 里的签名"
          else
            echo "没有设置 DEBUG_KEYSTORE_BASE64，调试版用临时签名"
          fi

      # 正式版签名：仓库 Secret 里的 RELEASE_KEYSTORE_BASE64（签名文件的 base64）+ 密码、别名，没设置时正式版用调试签名
      - name: Restore release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::没有设置 RELEASE_KEYSTORE_BASE64，正式版用调试签名"
          fi

      - name: Build debug + release APKs (完整版 + 无过敏记录版)
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # 构建机偶尔出网络问题（依赖下载失败）：失败了再试一次，第二次带完整报错
          ./gradlew assembleDebug assembleRelease || { echo "::warning::第一次打包失败，重试一次"; ./gradlew assembleDebug assembleRelease --stacktrace; }

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: birthday-reminder-apk
          path: android/app/build/outputs/apk/*/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: birthday-reminder-apk-release
          path: android/app/build/outputs/apk/*/release/*.apk
